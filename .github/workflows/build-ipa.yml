name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Init Capacitor & add iOS
        run: |
          set -e
          cat << 'EOF' > package.json
          {
            "name": "appipatest",
            "version": "1.0.0",
            "private": true
          }
          EOF

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.example.appipatest",
            "appName": "AppIpaTest",
            "webDir": "www"
          }
          EOF

          npm install --no-audit --no-fund @capacitor/core @capacitor/cli @capacitor/ios
          npx cap add ios
          npx cap sync ios

      - name: Build .app archive
        run: |
          set -e
          cd ios/App
          ls -la
          if [ -f "Podfile" ]; then
            pod install --repo-update || pod install
          fi
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              clean build
          else
            xcodebuild -project App.xcodeproj \
              -scheme App \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              clean build
          fi

      - name: Package .ipa
        run: |
          set -e
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r AppIpaTest.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AppIpaTest-ipa
          path: AppIpaTest.ipa
